name: Release

on:
  push:
    tags:
      - 'v*'

# Nothing by default; each job asks for what it needs.
permissions: {}

# Actions are pinned to commit SHAs because two jobs hold id-token: write.
# Dependabot updates the SHA and the version comment together.

jobs:
  # Builds, tests and packs with read-only rights. Nothing in this job can
  # publish: the tarball goes to the publish job as an artifact, so a build
  # or test dependency never runs next to the OIDC token.
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history and branches, for the main ancestry check below.
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Check tag matches package and server.json versions
        run: |
          version="$(node -p 'require("./package.json").version')"
          test "$GITHUB_REF_NAME" = "v$version"
          test "$(node -p 'require("./server.json").version')" = "$version"
          test "$(node -p 'require("./server.json").packages[0].version')" = "$version"

      # Only a commit that reached main through a green pull request ships.
      - name: Check the tagged commit is on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - run: npm test
      - run: node scripts/audit-prod.mjs

      # dist is built above; scripts off so the tarball is exactly what was tested.
      - run: npm pack --ignore-scripts

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package
          path: cypress-mcp-*.tgz
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-latest
    # The "release" environment only accepts v* tags (repository settings).
    environment: release
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      # Trusted publishing (OIDC) needs npm 11.5.1 or later. An exact version,
      # so a new npm release cannot change the publish step unreviewed.
      - run: npm install -g npm@11.21.3

      # A version published by hand must not fail the release.
      - name: Check if version is already on npm
        id: npm
        run: |
          if npm view "cypress-mcp@${GITHUB_REF_NAME#v}" version > /dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.npm.outputs.published != 'true'
        run: npm publish "cypress-mcp-${GITHUB_REF_NAME#v}.tgz" --provenance --access public

      - name: Create GitHub Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          generate_release_notes: true

  # Lists the server in the official MCP Registry (registry.modelcontextprotocol.io).
  # Runs after the npm publish: the registry checks that the npm package exists
  # and that its package.json mcpName matches server.json. Login is DNS based:
  # the TXT record "v=MCPv1; k=ed25519; p=..." on the jadev-corp.com apex grants
  # the com.jadev-corp namespace, and MCP_PRIVATE_KEY (Ed25519, hex) signs the
  # login. The key is a secret of the "release" environment, so this job runs
  # in that environment too, and like the npm job only for v* tags.
  mcp-registry:
    needs: publish
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
    env:
      # Raise deliberately; the binary is verified against this tag's Sigstore bundle.
      MCP_PUBLISHER_VERSION: v1.8.9
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Like the npm step: a version already in the registry must not fail the release.
      - name: Check if version is already in the MCP Registry
        id: registry
        run: |
          name="$(jq -r .name server.json | sed 's#/#%2F#')"
          status="$(curl --silent --output /dev/null --write-out '%{http_code}' \
            "https://registry.modelcontextprotocol.io/v0.1/servers/${name}/versions/${GITHUB_REF_NAME#v}")"
          if [ "$status" = "200" ]; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      # npm can take minutes to serve a version after the publish job ends
      # ("Your package is being processed"), and the registry checks npm.
      # The 0.4.0 registry step failed this way.
      - name: Wait until npm serves this version
        if: steps.registry.outputs.published != 'true'
        run: |
          for _ in $(seq 1 40); do
            if npm view "cypress-mcp@${GITHUB_REF_NAME#v}" version > /dev/null 2>&1; then
              exit 0
            fi
            sleep 15
          done
          echo "npm does not serve cypress-mcp@${GITHUB_REF_NAME#v} after 10 minutes" >&2
          exit 1

      - if: steps.registry.outputs.published != 'true'
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      - name: Download and verify mcp-publisher
        if: steps.registry.outputs.published != 'true'
        run: |
          set -euo pipefail
          archive="mcp-publisher_linux_amd64.tar.gz"
          base_url="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}"
          curl --fail --location --silent --show-error --output "$archive" "$base_url/$archive"
          curl --fail --location --silent --show-error --output "$archive.sigstore.json" "$base_url/$archive.sigstore.json"
          cosign verify-blob \
            --bundle "$archive.sigstore.json" \
            --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/${MCP_PUBLISHER_VERSION}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$archive"
          tar xzf "$archive" mcp-publisher
          rm -f "$archive" "$archive.sigstore.json"

      # mcp-publisher reads the key only from --private-key; it ignores the
      # environment (v0.5.1 failed with "private key (hex) is required"). The
      # secret goes in through env so it is not expanded into this script, and
      # Actions masks it in the log.
      - name: Publish to the MCP Registry
        if: steps.registry.outputs.published != 'true'
        env:
          MCP_PRIVATE_KEY: ${{ secrets.MCP_PRIVATE_KEY }}
        run: |
          ./mcp-publisher login dns --domain jadev-corp.com --private-key "$MCP_PRIVATE_KEY"
          ./mcp-publisher publish
